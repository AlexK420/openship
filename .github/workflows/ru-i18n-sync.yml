name: Russian i18n sync

on:
  push:
    branches:
      - sync-russian-i18n-2026-09-17

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git clone --branch "$BRANCH" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git fetch origin main:refs/remotes/origin/main
      - name: Audit Russian dictionary
        run: cd repo && node scripts/ru-i18n-audit.mjs
