name: Actions Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-diagnostic.yml'

permissions:
  contents: read

jobs:
  runner:
    name: Runner availability
    runs-on: ubuntu-latest
    steps:
      - name: Runner alive
        shell: bash
        run: |
          echo "GitHub-hosted runner is available"
          uname -a
